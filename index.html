function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function now(){return new Date().toLocaleString("pt-BR")}
function audit(action,entity,record,details=""){S.audits.push({id:S.audits.length+1,at:now(),user:S.user,action,entity,record,details});save()}
function modal(t,b){document.getElementById("mt").textContent=t;document.getElementById("mb").innerHTML=b;document.getElementById("modal").classList.remove("hidden")}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
const pages=[
["dashboard","Dashboard"],["dp","DP / Fechamento"],["employees","Colaboradores 360°"],["aso","ASO"],
["vac","Férias e Afastamentos"],["docs","Documentos Obrigatórios"],["fiscal","Fiscalização"],
["reports","Relatórios"],["audit","Auditoria"],["users","Usuários e Permissões"]
];
function can(page){
 if(S.role==="FISCAL") return ["fiscal"].includes(page);
 return true;
}
function nav(){document.getElementById("nav").innerHTML=pages.filter(p=>can(p[0])).map(p=>`<button id="n_${p[0]}" onclick="go('${p[0]}')">${p[1]}</button>`).join("")}
function go(page){
 if(!can(page)) return;
 document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("on"));
 const n=document.getElementById("n_"+page); if(n)n.classList.add("on");
 document.getElementById("title").textContent=pages.find(x=>x[0]===page)?.[1]||"Cabana Gestão";
 document.getElementById("roleLabel").textContent=`${S.user} • ${S.role}`;
 const v=document.getElementById("view");
 viewEl.innerHTML="";
 ({dashboard,dp,employees:employeesPage,aso,vac,docs,fiscal,reports,audit:auditsPage,users:usersPage}[page]||dashboard)();
}
let quickSector="";
function openSector(name){quickSector=name;go("employees");}
function dashboard(){
 const c=S.closure, done=c.done.filter(Boolean).length, pct=Math.round(done/24*100);
 const sectorMap={};S.employees.forEach(e=>{const n=e.sector||e.dept||"Sem setor";sectorMap[n]=(sectorMap[n]||0)+1});
 const sectorCounts=Object.entries(sectorMap).sort((a,b)=>b[1]-a[1]).map(([name,count])=>({name,count}));
 const exp=S.docs.filter(d=>d.exp && daysTo(d.exp)<=90).length;
 const aso=S.aso.filter(a=>a.next && daysTo(a.next)<=90).length;
 const unresolved=S.alerts.filter(a=>a.state!=="Resolvido").length;
 viewEl.innerHTML=`
 <div class="grid">
 <div class="card"><div class="muted">Colaboradores cadastrados</div><div class="kpi">${S.employees.length}</div><div class="muted">Base atual</div></div>
 <div class="card"><div class="muted">Fechamento 09/2026</div><div class="kpi">${pct}%</div><div class="muted">${c.status==="closed"?"Fechado":c.reopen?"Reaberto":"Em andamento"}</div></div>
 <div class="card"><div class="muted">Alertas ativos</div><div class="kpi">${unresolved}</div><div class="muted">internos, sem notificação externa</div></div>
 <div class="card"><div class="muted">Documentos/ASO próximos</div><div class="kpi">${exp+aso}</div><div class="muted">até 90 dias</div></div>
 </div>
 <div class="section card"><div class="title"><h2>Fechamento 09/2026</h2><button class="btn primary" onclick="go('dp')">Abrir DP</button></div>
 <div class="progress"><div style="width:${pct}%"></div></div><p>${done}/24 itens concluídos — ${pct}%</p>
 ${S.role==="GERENCIA"?'<div class="notice info">Gerência pode analisar e autorizar/recusar solicitações de reabertura.</div>':''}
 ${c.reopen?`<div class="notice warn"><b>Competência reaberta.</b> Motivo: ${esc(c.reopen.reason)}</div>`:""}
 </div>
 <div class="section card"><div class="title"><h2>Funcionários por setor</h2><span class="muted">Acesso rápido à equipe de cada setor</span></div><div class="sector-grid">${sectorCounts.map(x=>`<button class="sector-card" onclick="openSector('${esc(x.name)}')"><div class="sector-name">${esc(x.name)}</div><div class="sector-count">${x.count}</div><div class="muted">funcionário${x.count===1?"":"s"}</div></button>`).join("")}</div></div>
 <div class="section grid">
 <div class="card"><b>ASO</b><p class="muted">${S.aso.length} registros</p><button class="btn secondary" onclick="go('aso')">Consultar</button></div>
 <div class="card"><b>Férias/Afastamentos</b><p class="muted">${S.vacations.length+S.absences.length} registros</p><button class="btn secondary" onclick="go('vac')">Consultar</button></div>
 <div class="card"><b>Documentos</b><p class="muted">${S.docs.length} cadastrados</p><button class="btn secondary" onclick="go('docs')">Consultar</button></div>
 <div class="card"><b>Auditoria</b><p class="muted">${S.audits.length} registros imutáveis</p><button class="btn secondary" onclick="go('audit')">Consultar</button></div>
 </div>`;
}
function dp(){
 const c=S.closure, done=c.done.filter(Boolean).length,pct=Math.round(done/24*100), closed=c.status==="closed";
 let html=`<div class="card"><div class="title"><h2>Fechamento DP — 09/2026</h2><span class="tag ${closed?"ok":"warn"}">${closed?"FECHADO":c.reopen?"REABERTO":"EM ANDAMENTO"}</span></div>
 <div class="progress"><div style="width:${pct}%"></div></div><p><b>${pct}%</b> — ${done}/24 — fechamento nº ${c.version}</p>
 ${closed?'<div class="notice ok"><b>Fechamento concluído.</b> Competência bloqueada para edição.</div>':c.reopen?'<div class="notice warn"><b>Competência reaberta.</b> Apenas os itens selecionados pela Gerência/fluxo de reabertura voltam a pendente.</div>':'<div class="notice info">Evidência é opcional nos 24 itens. Todos os 24 itens são obrigatórios para fechar.</div>'}
 </div>`;
 html+=`<div class="section card"><div class="title"><h2>Checklist — 24 itens</h2><span class="muted">Evidência opcional</span></div>`;
 html+=dpItems.map((item,i)=>{
 const checked=c.done[i];
 return `<div class="check"><input type="checkbox" ${checked?"checked":""} ${closed||S.role!=="DP"?"disabled":""} onchange="toggleDP(${i},this.checked)">
 <div style="flex:1"><b>${i+1}. ${item}</b><small>${checked?"Concluído":"Pendente"} ${c.evidence[i]?`• Evidência: ${esc(c.evidence[i])}`:"• Sem anexo"}</small></div>
 ${!closed&&S.role==="DP"?`<button class="btn secondary" onclick="itemEvidence(${i})">Evidência</button>`:""}
 </div>`;
 }).join("");
 html+=`<div class="row" style="margin-top:16px">`;
 if(!closed&&S.role==="DP") html+=`<button class="btn primary" onclick="finishDP()">Concluir Fechamento</button><button class="btn secondary" onclick="completeAllDP()">Teste 24/24</button>`;
 if(closed&&S.role==="DP") html+=`<button class="btn warn" onclick="requestReopen()">Solicitar Reabertura</button>`;
 if(closed&&S.role==="DP"&&c.reopen?.state==="requested") html+=`<div class="notice warn"><b>Solicitação enviada à Gerência.</b> Motivo: ${esc(c.reopen.reason)}</div>`;
 if(closed&&S.role==="GERENCIA"&&c.reopen?.state==="requested") html+=`<button class="btn primary" onclick="authorizeReopen()">Analisar Reabertura</button><div class="notice warn"><b>Há uma solicitação de reabertura aguardando sua autorização.</b><br>Solicitante: ${esc(c.reopen.requestedBy||"—")}<br>Motivo: ${esc(c.reopen.reason||"—")}</div>`;
 if(closed&&S.role==="GERENCIA"&&c.reopen?.state!=="requested") html+=`<div class="notice info">Nenhuma solicitação de reabertura pendente.</div>`;
 html+=`</div></div>`;
 html+=`<div class="section card"><div class="title"><h2>Histórico do fechamento</h2></div><table><tr><th>Versão</th><th>Status</th><th>Data</th><th>Usuário</th><th>Motivo</th></tr>
 <tr><td>${c.version}</td><td>${c.status}</td><td>${c.closedAt||"—"}</td><td>${c.closedAt?"Usuário DP":"—"}</td><td>${c.reopen?esc(c.reopen.reason):"—"}</td></tr>
 ${c.reopen?`<tr><td>${c.version}</td><td>Reabertura ${esc(c.reopen.state||"")}</td><td>${c.reopen.authorizedAt||c.reopen.requestedAt||"—"}</td><td>${esc(c.reopen.authorizedBy||c.reopen.requestedBy||"—")}</td><td>${esc(c.reopen.reason||"—")}</td></tr>`:""}</table></div>`;
 viewEl.innerHTML=html;
}
function toggleDP(i,val){if(S.role!=="DP"||S.closure.status==="closed")return;S.closure.done[i]=val;save();audit("ALTERAR_ITEM_FECHAMENTO","Fechamento","09/2026",`${i+1} - ${dpItems[i]} = ${val?"Concluído":"Pendente"}`);go("dp")}
function itemEvidence(i){
 modal("Evidência — item "+(i+1),`<label>Nome do arquivo/comprovante</label><input id="ev" style="width:100%" value="${esc(S.closure.evidence[i]||"")}"><label style="display:block;margin-top:10px">Observação</label><textarea id="eno">${esc(S.closure.notes[i]||"")}</textarea><div class="right" style="margin-top:12px"><button class="btn primary" onclick="saveEvidence(${i})">Salvar</button></div>`);
}
function saveEvidence(i){S.closure.evidence[i]=document.getElementById("ev").value;S.closure.notes[i]=document.getElementById("eno").value;save();audit("EVIDENCIA_FECHAMENTO","Fechamento","09/2026",`Item ${i+1}`);closeModal();go("dp")}
function completeAllDP(){if(S.role!=="DP")return;S.closure.done=Array(24).fill(true);save();audit("TESTE_24_24","Fechamento","09/2026","Todos os itens marcados");go("dp")}
function finishDP(){
 if(S.role!=="DP")return;
 const done=S.closure.done.filter(Boolean).length;if(done<24){modal("Fechamento bloqueado",`Existem <b>${24-done}</b> itens pendentes. O fechamento exige 24/24.`);return}
 if(!S.closure.done[23]){modal("Liberação pendente","O item 24 — Confirmação de liberação — deve estar concluído.");return}
 S.closure.status="closed";S.closure.closedAt=now();S.closure.reopen=null;save();audit("CONCLUIR_FECHAMENTO","Fechamento","09/2026",`Fechamento nº ${S.closure.version}`);go("dp");modal("Fechamento concluído","A competência 09/2026 foi fechada pelo DP. A Gerência somente monitora.");
}
function requestReopen(){
 if(S.role!=="DP")return;
 if(S.closure.status!=="closed"){modal("Indisponível","A competência precisa estar fechada para solicitar reabertura.");return}
 if(S.closure.reopen?.state==="requested"){modal("Solicitação já enviada","A competência já possui uma solicitação aguardando a Gerência.");return}
 modal("Solicitar reabertura",`<p>Informe obrigatoriamente o motivo da reabertura.</p><textarea id="rr" placeholder="Ex.: correção de informação lançada no fechamento"></textarea><div class="right" style="margin-top:10px"><button class="btn primary" onclick="sendReopen()">Enviar para Gerência</button></div>`);
}
function sendReopen(){
 const r=document.getElementById("rr").value.trim();if(!r){modal("Obrigatório","Informe a justificativa.");return}
 S.closure.reopen={state:"requested",reason:r,requestedAt:now(),requestedBy:S.user};
 save();audit("SOLICITAR_REABERTURA","Fechamento","09/2026",r);closeModal();go("dp");
 modal("Solicitação enviada","A competência continua bloqueada. A Gerência precisa autorizar a reabertura.");
}
function authorizeReopen(){
 if(S.role!=="GERENCIA")return;
 if(S.closure.status!=="closed"){modal("Indisponível","A competência não está fechada.");return}
 if(!S.closure.reopen||S.closure.reopen.state!=="requested"){modal("Sem solicitação","Não existe solicitação de reabertura pendente.");return}
 const reason=S.closure.reopen.reason;
 modal("Autorizar reabertura",`<div class="notice warn"><b>Solicitação de:</b> ${esc(S.closure.reopen.requestedBy||"—")}<br><b>Motivo:</b> ${esc(reason)}</div><p>Selecione os itens que deverão voltar a pendente.</p><div id="reopenItems">${dpItems.map((x,i)=>`<label class="check"><input type="checkbox" data-ri="${i}"> <span>${i+1}. ${x}</span></label>`).join("")}</div><div class="right" style="margin-top:12px"><button class="btn primary" onclick="confirmReopen()">Autorizar reabertura</button><button class="btn danger" style="margin-left:6px" onclick="denyReopen()">Recusar</button></div>`);
}
function confirmReopen(){
 const idx=[...document.querySelectorAll("[data-ri]:checked")].map(x=>+x.dataset.ri);
 if(!idx.length){modal("Seleção obrigatória","Selecione pelo menos um item para correção.");return}
 idx.forEach(i=>S.closure.done[i]=false);
 S.closure.status="open";
 S.closure.reopen.state="authorized";
 S.closure.reopen.authorizedAt=now();
 S.closure.reopen.authorizedBy=S.user;
 S.closure.version++;
 save();audit("AUTORIZAR_REABERTURA","Fechamento","09/2026",`Itens reabertos: ${idx.map(i=>i+1).join(", ")}`);closeModal();go("dp");
 modal("Reabertura autorizada","A competência foi reaberta pela Gerência. O DP pode corrigir os itens selecionados e realizar novo fechamento.");
}
function denyReopen(){
 if(S.role!=="GERENCIA")return;
 const r=prompt("Informe o motivo da recusa:");
 if(!r||!r.trim()){alert("O motivo da recusa é obrigatório.");return}
 S.closure.reopen.state="denied";
 S.closure.reopen.deniedAt=now();
 S.closure.reopen.deniedBy=S.user;
 S.closure.reopen.denialReason=r.trim();
 save();audit("RECUSAR_REABERTURA","Fechamento","09/2026",r.trim());closeModal();go("dp");
 modal("Reabertura recusada","A competência continua fechada. A solicitação foi registrada na auditoria.");
}
function switchUser(){
 const opts=S.users.filter(u=>u.active).map((u,i)=>`<option value="${i}">${esc(u.name)} — ${esc(u.role)}</option>`).join("");
 modal("Trocar usuário — homologação",`<p>Use esta função somente para testar os diferentes perfis antes da hospedagem.</p><select id="su" style="width:100%">${opts}</select><div class="right" style="margin-top:12px"><button class="btn primary" onclick="applySwitchUser()">Entrar como usuário</button></div>`);
}
function applySwitchUser(){
 const u=S.users[Number(document.getElementById("su").value)];if(!u)return;
 S.role=u.role;S.user=u.name;save();audit("TROCAR_USUARIO_HOMOLOGACAO","Usuário",u.name,u.role);closeModal();nav();go("dashboard");
}
function employeesPage(){
 viewEl.innerHTML=`<div class="card"><div class="title"><h2>Colaboradores 360°</h2><span class="muted">${S.employees.length} cadastrados • salários não exibidos</span></div>
 <div class="toolbar"><input id="eq" placeholder="Nome, código ou setor" value="${esc(quickSector)}" oninput="renderEmployees()"><select id="es" onchange="renderEmployees()"><option>Todos</option><option>Ativo</option><option>Férias</option><option>Afastado/INSS</option><option>Aviso-prévio</option><option>Inativo</option></select>
 ${S.role==="DP"?'<button class="btn primary" onclick="newEmployee()">Novo colaborador</button>':""}<button class="btn secondary" onclick="importEmployeeHelp()">Importar planilha</button></div><div id="empTable"></div></div>`;
 renderEmployees();
 quickSector="";
}
function renderEmployees(){
 const q=(document.getElementById("eq")?.value||"").toLowerCase(), st=document.getElementById("es")?.value||"Todos";
 const arr=S.employees.filter(e=>(st==="Todos"||e.status===st)&&`${e.code} ${e.name} ${e.sector||e.dept||""}`.toLowerCase().includes(q));
 document.getElementById("empTable").innerHTML=`<table><tr><th>Código</th><th>Nome</th><th>Setor</th><th>Cargo</th><th>Status</th><th>Ações</th></tr>${arr.map(e=>`<tr><td>${e.code}</td><td>${esc(e.name)}</td><td>${esc(e.sector||e.dept||"")}</td><td>${esc(e.cargo)}</td><td><span class="tag ${e.status==="Ativo"?"ok":e.status==="Inativo"?"red":"warn"}">${e.status}</span></td><td><button class="btn blue" onclick="profile('${e.code}')">360°</button></td></tr>`).join("")}</table>`;
}
function profile(code){
 const e=S.employees.find(x=>x.code===code);if(!e)return;
 const aso=S.aso.filter(a=>a.code===code),va=S.vacations.filter(a=>a.code===code),ab=S.absences.filter(a=>a.code===code),docs=S.docs.filter(d=>d.employeeCode===code);
 const disc=S.disciplinary.filter(x=>x.code===code),terms=S.terminations.filter(x=>x.code===code);
 const warn=disc.filter(x=>x.kind==="Advertência"), susp=disc.filter(x=>x.kind==="Suspensão");
 modal("Colaborador 360°",`<div class="card"><b>${esc(e.name)}</b><p>${esc(e.code)} • ${esc(e.sector||e.dept||"")} • ${esc(e.cargo)}</p><p>Status: <span class="tag ${e.status==="Ativo"?"ok":"warn"}">${esc(e.status)}</span></p><p>Admissão: ${esc(e.admission||"—")}</p>${e.terminationDate?`<p><b>Desligamento:</b> ${esc(e.terminationDate)} • ${esc(e.terminationType||"—")}</p>`:""}</div>
 <div class="toolbar"><button class="btn primary" onclick="newDisciplinary('${e.code}','Advertência')">+ Advertência</button><button class="btn secondary" onclick="newDisciplinary('${e.code}','Suspensão')">+ Suspensão</button>${e.status!=="Inativo"?`<button class="btn danger" onclick="newTermination('${e.code}')">Registrar desligamento</button>`:""}</div>
 <h4>ASO</h4><p>${aso.length} registro(s)</p><h4>Férias</h4><p>${va.length} registro(s)</p><h4>Afastamentos</h4><p>${ab.length} registro(s)</p><h4>Documentos</h4><p>${docs.length} registro(s)</p>
 <h4>Advertências (${warn.length})</h4>${renderDisc(warn)}
 <h4>Suspensões (${susp.length})</h4>${renderDisc(susp)}
 <h4>Histórico de desligamento (${terms.length})</h4>${terms.map(x=>`<div class="notice warn"><b>${esc(x.date)} — ${esc(x.type)}</b><br>${esc(x.reason)}${x.fileName?`<br><a href="${x.dataUrl||'#'}" download="${esc(x.fileName)}">Anexo: ${esc(x.fileName)}</a>`:""}</div>`).join("")||"<p class=\"muted\">Nenhum desligamento registrado.</p>"}
 <h4>Timeline</h4><p>${(e.timeline||[]).map(x=>esc(x)).join("<br>")||"Sem eventos"}</p>`);
}
function renderDisc(items){return items.map(x=>`<div class="notice ${x.kind==="Suspensão"?"warn":"info"}"><b>${esc(x.date)} — ${esc(x.kind)}</b><br>${esc(x.reason)}${x.fileName?`<br><a href="${x.dataUrl||'#'}" download="${esc(x.fileName)}">Anexo: ${esc(x.fileName)}</a>`:""}</div>`).join("")||"<p class=\"muted\">Nenhum registro.</p>"}
function newDisciplinary(code,kind){
 const e=S.employees.find(x=>x.code===code);
 modal("Nova "+kind,`<div class="two"><div><label>Data</label><input id="ddate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label>Motivo / descrição</label><input id="dreason" placeholder="Informe o motivo"></div></div><label>Anexo (opcional)</label><input id="dfile" type="file" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx"><div class="right" style="margin-top:12px"><button class="btn primary" onclick="saveDisciplinary('${code}','${kind}')">Salvar ${kind}</button></div>`);
}
function saveDisciplinary(code,kind){
 const reason=document.getElementById("dreason").value.trim();if(!reason){modal("Campo obrigatório","Informe o motivo/descrição.");return}
 const file=document.getElementById("dfile").files[0];const rec={id:Date.now(),code,kind,date:document.getElementById("ddate").value,reason,fileName:file?file.name:"",dataUrl:""};
 const finish=()=>{S.disciplinary.push(rec);const e=S.employees.find(x=>x.code===code);e.timeline=e.timeline||[];e.timeline.unshift(`${kind} registrada em ${new Date().toLocaleDateString("pt-BR")}: ${reason}`);audit("CRIAR_"+kind.toUpperCase(),"Colaborador",code,reason);closeModal();profile(code)};
 if(file){const rd=new FileReader();rd.onload=()=>{rec.dataUrl=rd.result;finish()};rd.readAsDataURL(file)}else finish();
}
function newTermination(code){
 modal("Registrar desligamento",`<div class="two"><div><label>Data do desligamento</label><input id="tdate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label>Tipo</label><select id="ttype"><option>Pedido de demissão</option><option>Dispensa sem justa causa</option><option>Dispensa por justa causa</option><option>Término de contrato</option><option>Outros</option></select></div><div style="grid-column:1/-1"><label>Motivo / observação</label><textarea id="treason" rows="3" placeholder="Informe o motivo ou observação"></textarea></div></div><label>Anexo rescisório (opcional)</label><input id="tfile" type="file" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx"><div class="right" style="margin-top:12px"><button class="btn danger" onclick="saveTermination('${code}')">Confirmar desligamento</button></div>`);
}
function saveTermination(code){
 const e=S.employees.find(x=>x.code===code);if(!e)return;const date=document.getElementById("tdate").value,type=document.getElementById("ttype").value,reason=document.getElementById("treason").value.trim();if(!date){modal("Campo obrigatório","Informe a data do desligamento.");return}
 const file=document.getElementById("tfile").files[0];const rec={id:Date.now(),code,date,type,reason,fileName:file?file.name:"",dataUrl:""};
 const finish=()=>{S.terminations.push(rec);e.status="Inativo";e.terminationDate=date;e.terminationType=type;e.timeline=e.timeline||[];e.timeline.unshift(`Desligamento registrado em ${date}: ${type}`);audit("DESLIGAR_COLABORADOR","Colaborador",code,`${type}${reason?" — "+reason:""}`);save();closeModal();profile(code)};
 if(file){const rd=new FileReader();rd.onload=()=>{rec.dataUrl=rd.result;finish()};rd.readAsDataURL(file)}else finish();
}
function newEmployee(){
 modal("Novo colaborador",`<div class="two"><div><label>Código</label><input id="nc"></div><div><label>Nome</label><input id="nn"></div><div><label>Setor</label><input id="ns"></div><div><label>Cargo</label><input id="ng"></div><div><label>Admissão</label><input id="na"></div></div><div class="right" style="margin-top:12px"><button class="btn primary" onclick="saveEmployee()">Cadastrar</button></div>`);
}
function saveEmployee(){
 const e={code:document.getElementById("nc").value.trim(),name:document.getElementById("nn").value.trim(),sector:document.getElementById("ns").value.trim(),cargo:document.getElementById("ng").value.trim(),status:"Ativo",admission:document.getElementById("na").value.trim(),timeline:[`Admitido/cadastrado em ${now()}`]};
 if(!e.code||!e.name){modal("Dados obrigatórios","Informe código e nome.");return}
 if(S.employees.some(x=>x.code===e.code)){modal("Duplicidade","Código já cadastrado.");return}
 S.employees.push(e);save();audit("CRIAR_COLABORADOR","Colaborador",e.code,e.name);closeModal();go("employees");
}
function importEmployeeHelp(){modal("Importação de colaboradores","Para a carga inicial, utilize CSV/XLSX com validação de CPF, duplicidade e campos obrigatórios. Esta versão de homologação deixa o fluxo preparado para a importação real sem gravar dados incompletos.");}
function aso(){
 viewEl.innerHTML=`<div class="card"><div class="title"><h2>ASO</h2><span class="muted">Vencimento calculado pelo sistema</span></div>
 <div class="toolbar">${S.role==="DP"?'<button class="btn primary" onclick="newASO()">Novo ASO</button>':""}<select id="af" onchange="renderASO()"><option>Todos</option><option>Válido</option><option>Vencendo</option><option>Vencido</option><option>Pendente</option></select></div><div id="asoTable"></div></div>`;renderASO();
}
function asoStatus(a){if(!a.date)return"Pendente";if(!a.next)return"Válido";const d=daysTo(a.next);return d<0?"Vencido":d<=90?"Vencendo":"Válido"}
function renderASO(){const f=document.getElementById("af")?.value||"Todos";const arr=S.aso.filter(a=>f==="Todos"||asoStatus(a)===f);document.getElementById("asoTable").innerHTML=`<table><tr><th>Colaborador</th><th>Tipo</th><th>Data</th><th>Próximo vencimento</th><th>Status</th><th>Arquivo</th></tr>${arr.map(a=>`<tr><td>${esc(empName(a.code))}</td><td>${a.type}</td><td>${a.date||"—"}</td><td>${a.next||"—"}</td><td><span class="tag ${asoStatus(a)==="Válido"?"ok":asoStatus(a)==="Vencido"?"red":"warn"}">${asoStatus(a)}</span></td><td>${a.file?esc(a.file):"—"}</td></tr>`).join("")}</table>`}
function newASO(){modal("Novo ASO",`<div class="two"><div><label>Colaborador</label><select id="ac">${S.employees.map(e=>`<option value="${e.code}">${esc(e.name)} — ${e.code}</option>`).join("")}</select></div><div><label>Tipo</label><select id="at"><option>Admissional</option><option>Periódico</option><option>Demissional</option><option>Retorno</option><option>Mudança de risco</option></select></div><div><label>Data</label><input id="ad" type="date"></div><div><label>Próximo vencimento</label><input id="an" type="date"></div><div><label>Arquivo</label><input id="afl"></div></div><p class="muted">Vencimento obrigatório em Periódico, Retorno e Mudança de risco; opcional em Admissional e Demissional.</p><div class="right"><button class="btn primary" onclick="saveASO()">Salvar</button></div>`)}
function saveASO(){const type=document.getElementById("at").value,next=document.getElementById("an").value;if(["Periódico","Retorno","Mudança de risco"].includes(type)&&!next){modal("Obrigatório","Informe o próximo vencimento.");return}const a={code:document.getElementById("ac").value,type,date:document.getElementById("ad").value,next,file:document.getElementById("afl").value};S.aso.push(a);const e=S.employees.find(x=>x.code===a.code);e.timeline.push(`ASO ${a.type} lançado em ${now()}`);save();audit("CRIAR_ASO","ASO",a.code,a.type);closeModal();go("aso")}
function vac(){
 viewEl.innerHTML=`<div class="card"><div class="title"><h2>Férias e Afastamentos</h2><span class="muted">Lançamentos ficam neste módulo</span></div><div class="toolbar">${S.role==="DP"?'<button class="btn primary" onclick="newVac()">Nova férias</button><button class="btn warn" onclick="newAbs()">Novo afastamento/atestado</button>':""}</div>
 <h3>Férias</h3><div id="vacTable"></div><h3>Afastamentos / Atestados</h3><div id="absTable"></div></div>`;
 document.getElementById("vacTable").innerHTML=`<table><tr><th>Colaborador</th><th>Período aquisitivo</th><th>Concessivo</th><th>Início</th><th>Fim</th><th>Status</th><th>Pagamento</th></tr>${S.vacations.map(a=>`<tr><td>${esc(empName(a.code))}</td><td>${a.acq||"—"}</td><td>${a.conc||"—"}</td><td>${a.start}</td><td>${a.end}</td><td><span class="tag warn">${a.status}</span></td><td>${a.payment||"Pendente"}</td></tr>`).join("")}</table>`;
 document.getElementById("absTable").innerHTML=`<table><tr><th>Colaborador</th><th>Tipo</th><th>Início</th><th>Fim</th><th>Status</th><th>Evidência</th></tr>${S.absences.map(a=>`<tr><td>${esc(empName(a.code))}</td><td>${a.type}</td><td>${a.start}</td><td>${a.end||"—"}</td><td>${a.status}</td><td>${a.file||"—"}</td></tr>`).join("")}</table>`;
}
function newVac(){modal("Nova férias",`<div class="two"><div><label>Colaborador</label><select id="vc">${S.employees.map(e=>`<option value="${e.code}">${esc(e.name)}</option>`).join("")}</select></div><div><label>Período aquisitivo</label><input id="vaq" placeholder="Ex.: 01/10/2025–30/09/2026"></div><div><label>Período concessivo</label><input id="vco" placeholder="Ex.: 01/10/2026–30/09/2027"></div><div><label>Início</label><input id="vs" type="date"></div><div><label>Fim</label><input id="ve" type="date"></div><div><label>Pagamento/cálculo</label><input id="vp" placeholder="Pago / Pendente / referência"></div><div><label>Evidência</label><input id="vf"></div></div><div class="right"><button class="btn primary" onclick="saveVac()">Salvar</button></div>`)}
function saveVac(){const a={code:vc.value,acq:vaq.value,conc:vco.value,start:vs.value,end:ve.value,status:"Programado",payment:vp.value,file:vf.value};if(!a.start||!a.end){modal("Obrigatório","Informe início e fim.");return}S.vacations.push(a);save();audit("CRIAR_FERIAS","Férias",a.code,`${a.start} a ${a.end}`);closeModal();go("vac")}
function newAbs(){modal("Novo afastamento / atestado",`<div class="two"><div><label>Colaborador</label><select id="xc">${S.employees.map(e=>`<option value="${e.code}">${esc(e.name)}</option>`).join("")}</select></div><div><label>Tipo</label><select id="xt"><option>Afastamento INSS</option><option>Atestado</option><option>Outros</option></select></div><div><label>Início</label><input id="xs" type="date"></div><div><label>Fim</label><input id="xe" type="date"></div><div><label>Evidência</label><input id="xf"></div><div><label>Observação</label><input id="xo"></div></div><p class="muted">Não registrar diagnóstico. CID, quando necessário, fica restrito a perfil autorizado.</p><div class="right"><button class="btn primary" onclick="saveAbs()">Salvar</button></div>`)}
function saveAbs(){const a={code:xc.value,type:xt.value,start:xs.value,end:xe.value,status:"Em andamento",file:xf.value,note:xo.value};if(a.type==="Afastamento INSS"&&!a.file){modal("Evidência obrigatória","Afastamento INSS exige evidência.");return}S.absences.push(a);const e=S.employees.find(x=>x.code===a.code);if(a.type==="Afastamento INSS")e.status="Afastado/INSS";e.timeline.push(`${a.type} lançado em ${now()}`);save();audit("CRIAR_AFASTAMENTO","Afastamento",a.code,a.type);closeModal();go("vac")}
function docs(){
 viewEl.innerHTML=`<div class="card"><div class="title"><h2>Documentos Obrigatórios</h2><span class="muted">Institucionais e documentos de colaboradores</span></div><div class="toolbar">${S.role==="DP"?'<button class="btn primary" onclick="newDoc()">Novo documento</button>':""}<select id="df" onchange="renderDocs()"><option>Todos</option><option>Institucional</option><option>Colaborador</option></select></div><div id="docTable"></div></div>`;renderDocs();
}
function daysTo(s){if(!s)return 99999;const d=new Date(s+"T00:00:00");return Math.ceil((d-new Date())/86400000)}
function docStatus(d){if(!d.exp)return"Sem validade";const n=daysTo(d.exp);return n<0?"Vencido":n<=90?"Vencendo":"Válido"}
function renderDocs(){const f=document.getElementById("df")?.value||"Todos";const arr=S.docs.filter(d=>f==="Todos"||d.category===f);document.getElementById("docTable").innerHTML=`<table><tr><th>Documento</th><th>Categoria</th><th>Vinculado</th><th>Validade</th><th>Status</th><th>Responsável</th><th>Arquivo</th></tr>${arr.map(d=>`<tr><td>${esc(d.name)}</td><td>${d.category}</td><td>${d.employeeCode?esc(empName(d.employeeCode)):"Institucional"}</td><td>${d.exp||"—"}</td><td><span class="tag ${docStatus(d)==="Válido"?"ok":docStatus(d)==="Vencido"?"red":"warn"}">${docStatus(d)}</span></td><td>${esc(d.owner||"—")}</td><td>${esc(d.file||"—")}</td></tr>`).join("")}</table>`}
function newDoc(){modal("Novo documento",`<div class="two"><div><label>Nome</label><input id="dn"></div><div><label>Categoria</label><select id="dc"><option>Institucional</option><option>Colaborador</option></select></div><div><label>Colaborador (se aplicável)</label><select id="de"><option value="">Institucional</option>${S.employees.map(e=>`<option value="${e.code}">${esc(e.name)}</option>`).join("")}</select></div><div><label>Número</label><input id="dnum"></div><div><label>Órgão emissor</label><input id="dorg"></div><div><label>Emissão</label><input id="di" type="date"></div><div><label>Validade</label><input id="dx" type="date"></div><div><label>Responsável</label><input id="dresp"></div><div><label>Substituto</label><input id="dsub"></div><div><label>Arquivo</label><input id="dfi"></div></div><div class="right"><button class="btn primary" onclick="saveDoc()">Salvar</button></div>`)}
function saveDoc(){const d={id:"D"+(S.docs.length+1),name:dn.value,category:dc.value,employeeCode:de.value,number:dnum.value,issuer:dorg.value,issue:di.value,exp:dx.value,owner:dresp.value,substitute:dsub.value,file:dfi.value,history:[]};if(!d.name){modal("Obrigatório","Informe o nome do documento.");return}S.docs.push(d);save();audit("CRIAR_DOCUMENTO","Documento",d.id,d.name);closeModal();go("docs")}
function fiscal(){
 const inst=S.docs.filter(d=>d.category==="Institucional");
 viewEl.innerHTML=`<div class="card"><div class="title"><h2>Modo Fiscalização</h2><span class="muted">Somente documentos institucionais</span></div>
 <div class="notice info">Acesso somente leitura. Também é possível gerar link temporário com validade curta. Todo acesso é auditado.</div>
 <div class="toolbar">${S.role!=="FISCAL"?'<button class="btn primary" onclick="newFiscalLink()">Gerar link temporário</button>':""}</div>
 <table><tr><th>Documento</th><th>Validade</th><th>Status</th><th>Arquivo</th></tr>${inst.map(d=>`<tr><td>${esc(d.name)}</td><td>${d.exp||"—"}</td><td>${docStatus(d)}</td><td>${esc(d.file||"Não anexado")}</td></tr>`).join("")}</table></div>
 <div class="section card"><h3>Links temporários</h3>${S.fiscalLinks.length?`<table><tr><th>Token</th><th>Validade</th><th>Status</th></tr>${S.fiscalLinks.map(x=>`<tr><td>${x.token}</td><td>${x.until}</td><td>${new Date(x.until)>new Date()?"Ativo":"Expirado"}</td></tr>`).join("")}</table>`:"Nenhum link gerado."}</div>`;
}
function newFiscalLink(){const until=new Date(Date.now()+30*60000);const x={token:"FISC-"+Math.random().toString(36).slice(2,10).toUpperCase(),until:until.toISOString()};S.fiscalLinks.push(x);save();audit("GERAR_LINK_FISCAL","Fiscalização",x.token,`Validade ${until.toLocaleString("pt-BR")}`);go("fiscal");modal("Link temporário gerado",`Token: <b>${x.token}</b><br>Validade: ${until.toLocaleString("pt-BR")}<br><br>Na versão de produção, o token será gerado pelo backend e poderá ser revogado a qualquer momento.`)}
function reports(){
 viewEl.innerHTML=`<div class="card"><div class="title"><h2>Relatórios</h2><span class="muted">Exportação controlada</span></div><div class="grid">
 ${["Fechamento mensal","Colaboradores","Férias","Afastamentos/Atestados","ASO","Documentos","Admissões/Desligamentos","Auditoria"].map((x,i)=>`<div class="card"><b>${x}</b><p class="muted">Consulta e exportação conforme permissão.</p><button class="btn secondary" onclick="exportReport('${x}')">Exportar CSV</button></div>`).join("")}</div>
 <div class="notice info">Toda exportação é registrada na auditoria. Relatórios de saúde ocupacional ficam restritos a perfis autorizados e não exibem diagnóstico no painel gerencial.</div></div>`;
}
function exportReport(name){if(S.role==="GERENCIA"&&name==="ASO"){audit("EXPORTAR_RELATORIO","Relatório",name,"Situação de ASO");downloadCSV(name,[["Colaborador","Tipo","Data","Vencimento","Status"],...S.aso.map(a=>[empName(a.code),a.type,a.date,a.next,asoStatus(a)])]);return}
 audit("EXPORTAR_RELATORIO","Relatório",name,"CSV");downloadCSV(name,[["Nome","Código","Setor","Status"],...S.employees.map(e=>[e.name,e.code,e.sector,e.status])])}
function downloadCSV(name,rows){const csv=rows.map(r=>r.map(x=>`"${String(x??"").replace(/"/g,'""')}"`).join(";")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));a.download=name.replace(/[^\w]+/g,"_")+".csv";a.click()}
function auditsPage(){
 viewEl.innerHTML=`<div class="card"><div class="title"><h2>Auditoria</h2><span class="muted">Registros somente de inserção</span></div><div class="notice info">Nenhum perfil pode editar ou excluir registros de auditoria nesta homologação.</div>
 <table><tr><th>ID</th><th>Data/hora</th><th>Usuário</th><th>Ação</th><th>Entidade</th><th>Registro</th><th>Detalhes</th></tr>${S.audits.slice().reverse().map(a=>`<tr><td>${a.id}</td><td>${a.at}</td><td>${esc(a.user)}</td><td>${a.action}</td><td>${a.entity}</td><td>${esc(a.record)}</td><td>${esc(a.details)}</td></tr>`).join("")}</table></div>`;
}
function usersPage(){
 viewEl.innerHTML=`<div class="card"><div class="title"><h2>Usuários e Permissões</h2><span class="muted">Admin TI administra</span></div><div class="notice info">Senha provisória e redefinição são administrativas. Conta bloqueia após 5 tentativas inválidas. Não há expiração automática por inatividade.</div>
 ${S.role==="ADMIN"?'<button class="btn primary" onclick="newUser()">Novo usuário</button>':""}
 <table style="margin-top:12px"><tr><th>Usuário</th><th>Perfil</th><th>Status</th><th>Ação</th></tr>${S.users.map((u,i)=>`<tr><td>${esc(u.name)}</td><td>${u.role}</td><td>${u.active?"Ativo":"Inativo"}</td><td>${S.role==="ADMIN"?`<button class="btn secondary" onclick="toggleUser(${i})">${u.active?"Inativar":"Ativar"}</button>`:"—"}</td></tr>`).join("")}</table></div>`;
}
function newUser(){modal("Novo usuário",`<div class="two"><div><label>Nome</label><input id="un"></div><div><label>Perfil</label><select id="ur"><option>DP</option><option>GERENCIA</option><option>FISCAL</option><option>ADMIN</option></select></div></div><div class="right"><button class="btn primary" onclick="saveUser()">Criar</button></div>`)}
function saveUser(){const u={name:un.value.trim(),role:ur.value,active:true};if(!u.name){modal("Obrigatório","Informe o nome.");return}S.users.push(u);save();audit("CRIAR_USUARIO","Usuário",u.name,u.role);closeModal();go("users")}
function toggleUser(i){S.users[i].active=!S.users[i].active;save();audit("ALTERAR_USUARIO","Usuário",S.users[i].name,S.users[i].active?"Ativado":"Inativado");go("users")}
function empName(code){return S.employees.find(e=>e.code===code)?.name||code}
nav();go("dashboard");
</script>
</body>
</html>
