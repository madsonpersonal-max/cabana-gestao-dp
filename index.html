function toggleDP(i,val){if(S.role!=="DP"||S.closure.status==="closed")return;S.closure.done[i]=val;save();audit("ALTERAR_ITEM_FECHAMENTO","Fechamento","09/2026",`${i+1} - ${dpItems[i]} = ${val?"Concluído":"Pendente"}`);go("dp")}
function itemEvidence(i){
 modal("Evidência — item "+(i+1),`<label>Nome do arquivo/comprovante</label><input id="ev" style="width:100%" value="${esc(S.closure.evidence[i]||"")}"><label style="display:block;margin-top:10px">Observação</label><textarea id="eno">${esc(S.closure.notes[i]||"")}</textarea><div class="right" style="margin-top:12px"><button class="btn primary" onclick="saveEvidence(${i})">Salvar</button></div>`);
}
function saveEvidence(i){S.closure.evidence[i]=document.getElementById("ev").value;S.closure.notes[i]=document.getElementById("eno").value;save();audit("EVIDENCIA_FECHAMENTO","Fechamento","09/2026",`Item ${i+1}`);closeModal();go("dp")}
function completeAllDP(){if(S.role!=="DP")return;S.closure.done=Array(24).fill(true);save();audit("TESTE_24_24","Fechamento","09/2026","Todos os itens marcados");go("dp")}
function finishDP(){
 if(S.role!=="DP")return;
 const done=S.closure.done.filter(Boolean).length;if(done<24){modal("Fechamento bloqueado",`Existem <b>${24-done}</b> itens pendentes. O fechamento exige 24/24.`);return}
 if(!S.closure.done[23]){modal("Liberação pendente","O item 24 — Confirmação de liberação — deve estar concluído.");return}
 S.closure.status="closed";S.closure.closedAt=now();S.closure.reopen=null;save();audit("CONCLUIR_FECHAMENTO","Fechamento","09/2026",`Fechamento nº ${S.closure.version}`);go("dp");modal("Fechamento concluído","A competência 09/2026 foi fechada pelo DP. A Gerência somente monitora.");
}
function requestReopen(){
 if(S.role!=="DP")return;
 modal("Solicitar reabertura",`<p>Informe obrigatoriamente o motivo.</p><textarea id="rr"></textarea><div class="right" style="margin-top:10px"><button class="btn primary" onclick="sendReopen()">Enviar solicitação</button></div>`);
}
function sendReopen(){
 const r=document.getElementById("rr").value.trim();if(!r){modal("Obrigatório","Informe a justificativa.");return}
 S.closure.reopen={state:"requested",reason:r,requestedAt:now(),requestedBy:S.user};save();audit("SOLICITAR_REABERTURA","Fechamento","09/2026",r);closeModal();go("dp");
}
function authorizeReopen(){
 if(S.role!=="GERENCIA")return;
 if(!S.closure.reopen||S.closure.reopen.state!=="requested"){modal("Sem solicitação","Não existe solicitação de reabertura pendente.");return}
 const reason=S.closure.reopen.reason;
 modal("Autorizar reabertura",`<p>Solicitação: <b>${esc(reason)}</b></p><p>Selecione os itens que deverão voltar a pendente.</p><div id="reopenItems">${dpItems.map((x,i)=>`<label class="check"><input type="checkbox" data-ri="${i}"> <span>${i+1}. ${x}</span></label>`).join("")}</div><div class="right" style="margin-top:12px"><button class="btn primary" onclick="confirmReopen()">Autorizar</button></div>`);
}
function confirmReopen(){
 const idx=[...document.querySelectorAll("[data-ri]:checked")].map(x=>+x.dataset.ri);
 if(!idx.length){modal("Seleção obrigatória","Selecione pelo menos um item para correção.");return}
 idx.forEach(i=>S.closure.done[i]=false);
 S.closure.status="open";S.closure.reopen.state="authorized";S.closure.reopen.authorizedAt=now();S.closure.reopen.authorizedBy=S.user;S.closure.version++;
 save();audit("AUTORIZAR_REABERTURA","Fechamento","09/2026",`Itens reabertos: ${idx.map(i=>i+1).join(", ")}`);closeModal();go("dp");
}

function parseBRDate(s){
 const p=String(s||"").split("/");
 if(p.length!==3)return null;
 const d=new Date(Number(p[2]),Number(p[1])-1,Number(p[0]));
 return isNaN(d.getTime())?null:d;
}
function fmtBRDate(d){
 return d?String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear():"";
}
function addYearsSafe(d,n){
 const x=new Date(d.getTime());
 const target=x.getFullYear()+n;
 x.setFullYear(target);
 if(x.getMonth()!==d.getMonth())x.setDate(0);
 return x;
}
function minusDays(d,n){
 const x=new Date(d.getTime());x.setDate(x.getDate()-n);return x;
}
function calcVacationPeriods(code){
 const e=S.employees.find(x=>x.code===code);
 const adm=parseBRDate(e?.admission);
 if(!adm)return {acq:"",conc:""};
 const today=new Date();today.setHours(0,0,0,0);
 let years=today.getFullYear()-adm.getFullYear();
 let anniversary=addYearsSafe(adm,years);
 if(anniversary>today){years--;anniversary=addYearsSafe(adm,years)}
 const acqStart=anniversary;
 const acqEnd=minusDays(addYearsSafe(acqStart,1),1);
 const concStart=addYearsSafe(acqStart,1);
 const concEnd=minusDays(addYearsSafe(concStart,1),1);
 return {acq:`${fmtBRDate(acqStart)} – ${fmtBRDate(acqEnd)}`,conc:`${fmtBRDate(concStart)} – ${fmtBRDate(concEnd)}`};
}
function fillVacationPeriods(){
 const p=calcVacationPeriods(document.getElementById("vc")?.value);
 const a=document.getElementById("vaq"),c=document.getElementById("vco");
 if(a)a.value=p.acq;
 if(c)c.value=p.conc;
}

function saveVac(){

 if(!start||!end){modal("Campo obrigatório","Informe início e fim das férias.");return}

 const file=document.getElementById("vfile")?.files?.[0];
 const rec={id:Date.now(),code,acq:document.getElementById("vaq").value.trim(),conc:document.getElementById("vco").value.trim(),start,end,status:"Pendente",payment:document.getElementById("vpay").value.trim()||"Pendente",fileName:file?file.name:"",dataUrl:""};
 const finish=()=>{S.vacations.push(rec);const e=S.employees.find(x=>x.code===code);e.timeline=e.timeline||[];e.timeline.unshift(`Férias lançadas em ${start} até ${end}`);save();audit("CRIAR_FERIAS","Férias",code,`${start} até ${end}`);closeModal();go("vac")};

}

function daysTo(s){if(!s)return 99999;const d=new Date(s+"T00:00:00");return Math.ceil((d-new Date())/86400000)}
function docStatus(d){const exp=d.expiry||d.exp;if(!exp)return"Sem validade";const n=daysTo(exp);return n<0?"Vencido":n<=90?"Vencendo":"Válido"}
function renderDocs(){
 const f=document.getElementById("df")?.value||"Todos";
 const arr=(S.docs||[]).filter(d=>f==="Todos"||d.category===f);
 document.getElementById("docTable").innerHTML=`<table><tr><th>Documento</th><th>Categoria</th><th>Vinculado</th><th>Validade</th><th>Status</th><th>Responsável</th><th>Arquivo</th></tr>${arr.map(d=>`<tr>
 <td>${esc(d.name||"—")}</td>
 <td>${esc(d.category||"—")}</td>
 <td>${d.employeeCode?esc(empName(d.employeeCode)):"Institucional"}</td>
 <td>${esc(d.expiry||d.exp||"—")}</td>
 <td><span class="tag ${docStatus(d)==="Válido"?"ok":docStatus(d)==="Vencido"?"red":"warn"}">${docStatus(d)}</span></td>
 <td>${esc(d.responsible||d.owner||"—")}</td>
 <td>${d.dataUrl?`<a href="${d.dataUrl}" target="_blank" rel="noopener" download="${esc(d.fileName||d.file||"documento")}">${esc(d.fileName||d.file||"Abrir documento")}</a>`:esc(d.fileName||d.file||"—")}</td>

}

function saveDoc(){
 const file=document.getElementById("dfile")?.files?.[0];
 const name=document.getElementById("dn")?.value.trim();
 if(!name){modal("Campo obrigatório","Informe o nome do documento.");return}
 if(file && file.size>8*1024*1024){modal("Arquivo muito grande","Para a homologação, use arquivo de até 8 MB.");return}

 const employeeCode=document.getElementById("dcol")?.value||"";
 const expiry=document.getElementById("dval")?.value||"";
 const rec={
   id:"D"+(Date.now()),
   name:name,
   category:document.getElementById("dc")?.value||"Institucional",
   employeeCode:employeeCode,
   code:employeeCode,
   number:document.getElementById("dnum")?.value.trim()||"",
   issuer:document.getElementById("dorg")?.value.trim()||"",
   issue:document.getElementById("dem")?.value||"",
   expiry:expiry,
   exp:expiry,
   responsible:document.getElementById("dresp")?.value.trim()||"",
   owner:document.getElementById("dresp")?.value.trim()||"",
   substitute:document.getElementById("dsub")?.value.trim()||"",
   fileName:file?file.name:"",
   file:file?file.name:"",
   dataUrl:""
 };

 const finish=()=>{
   S.docs=S.docs||[];
   S.docs.push(rec);
   save();
   audit("CRIAR_DOCUMENTO","Documento",rec.id,rec.name);
   closeModal();
   go("docs");
 };

 if(file){
   const reader=new FileReader();
   reader.onload=()=>{rec.dataUrl=reader.result;finish()};
   reader.onerror=()=>modal("Erro no arquivo","Não foi possível ler o arquivo selecionado.");
   reader.readAsDataURL(file);
 }else{
   finish();
 }
}

function exportReport(name,format="xlsx"){
 let headers=[],rows=[];
 if(name==="Fechamento mensal"){
   headers=["Competência","Status","DP","Financeiro","Gerência","Data de fechamento","Versão","Usuário"];
   const c=S.closure||{};
   const dp=Math.round((c.done||[]).filter(Boolean).length/24*100);
   const fin=(typeof S.financeCompleted==="boolean"?S.financeCompleted:false) ? 100 : "";
   const status=c.status==="closed"?"Fechado":c.status==="reopened"?"Reaberto":"Em andamento";
   rows=[["09/2026",status,dp,fin,status==="Fechado"?"Aprovado":status,c.closedAt||"",c.version||1,S.user||""]];
 }else if(name==="Colaboradores"){
   headers=["Nome","Código","Setor","Cargo","Status","Admissão"];
   rows=(S.employees||[]).map(e=>[e.name,e.code,e.sector||e.dept||"",e.cargo||"",e.status||"",e.admission||""]);
 }else if(name==="Férias"){
   headers=["Colaborador","Código","Período aquisitivo","Período concessivo","Início","Fim","Status","Pagamento/Cálculo","Evidência"];
   rows=(S.vacations||[]).map(a=>[empName(a.code),a.code,a.acq||"",a.conc||"",a.start||"",a.end||"",a.status||"",a.payment||"Pendente",a.fileName||""]);
 }else if(name==="Afastamentos/Atestados"){
   headers=["Colaborador","Código","Tipo","Início","Fim","Status","Evidência"];
   rows=(S.absences||[]).map(a=>[empName(a.code),a.code,a.type||"",a.start||"",a.end||"",a.status||"",a.fileName||""]);
 }else if(name==="ASO"){
   if(!["GERENCIA","DP","ADMIN"].includes(S.role)){modal("Acesso restrito","Este relatório é permitido apenas a perfis autorizados.");return}
   headers=["Colaborador","Código","Tipo","Data","Próximo vencimento","Status","Arquivo"];
   rows=(S.aso||[]).map(a=>[empName(a.code),a.code,a.type||"",a.date||"",a.next||"",asoStatus(a),a.fileName||""]);
 }else if(name==="Documentos"){
   headers=["Documento","Categoria","Vinculado","Número","Órgão emissor","Emissão","Validade","Status","Responsável","Substituto","Arquivo"];
   rows=(S.docs||[]).map(d=>[d.name||"",d.category||"Institucional",d.employeeCode?empName(d.employeeCode):"Institucional",d.number||"",d.issuer||"",d.issue||"",d.expiry||"",docStatus(d),d.responsible||"",d.substitute||"",d.fileName||""]);
 }else if(name==="Admissões/Desligamentos"){
   headers=["Nome","Código","Setor","Cargo","Admissão","Data desligamento","Tipo desligamento","Motivo","Status"];
   const byCode={};
   (S.terminations||[]).forEach(t=>{byCode[t.code]=t});
   rows=(S.employees||[]).filter(e=>e.admission||e.terminationDate||byCode[e.code]).map(e=>{
     const t=byCode[e.code]||{};
     return [e.name,e.code,e.sector||e.dept||"",e.cargo||"",e.admission||"",e.terminationDate||t.date||"",e.terminationType||t.type||"",t.reason||"",e.status||""];
   });
 }else if(name==="Auditoria"){
   headers=["ID","Data/hora","Usuário","Ação","Entidade","Registro","Detalhes"];
   rows=(S.audits||[]).map(a=>[a.id,a.at,a.user,a.action,a.entity,a.record,a.details]);
 }
 audit("EXPORTAR_RELATORIO","Relatório",name,`${format.toUpperCase()} — ${rows.length} registro(s)`);
 const data=[headers,...rows];
 if(format==="pdf") downloadPDF(name,headers,rows);
 else downloadXLSX(name,data);
}
function downloadXLSX(name,data){
 if(!window.XLSX){alert("Biblioteca Excel não carregada. Verifique a conexão e tente novamente.");return}
 const wb=XLSX.utils.book_new();
 const ws=XLSX.utils.aoa_to_sheet(data);
 ws['!cols']=data[0].map((_,i)=>({wch:Math.min(45,Math.max(12,...data.map(r=>String(r[i]??"").length))+2)}));
 XLSX.utils.book_append_sheet(wb,ws,"Relatório");
 XLSX.writeFile(wb,name.replace(/[^\wÀ-ÿ]+/g,"_")+".xlsx");
}
function downloadPDF(name,headers,rows){
 if(!window.jspdf?.jsPDF){alert("Biblioteca PDF não carregada. Verifique a conexão e tente novamente.");return}
 const {jsPDF}=window.jspdf;
 const doc=new jsPDF({orientation:headers.length>7?"landscape":"portrait",unit:"mm",format:"a4"});
 const margin=10, pageW=doc.internal.pageSize.getWidth(), pageH=doc.internal.pageSize.getHeight();
 let y=10;
 try{doc.addImage(CABANA_LOGO_DATA,"PNG",margin,y,22,22); }catch(e){}
 doc.setFontSize(14);doc.text("Cabana Gestão — "+name,margin+26,y+7);
 doc.setFontSize(8);doc.text("Cabana Clube • 40 anos",margin+26,y+12);
 doc.text("Gerado em "+new Date().toLocaleString("pt-BR"),margin+26,y+17);y+=27;
 const usable=pageW-margin*2;
 const widths=headers.map((h,i)=>Math.max(18,Math.min(55,Math.max(String(h).length,...rows.slice(0,80).map(r=>String(r[i]??"").length))*2.1)));
 const total=widths.reduce((a,b)=>a+b,0);const scale=total>usable?usable/total:1;
 const w=widths.map(x=>x*scale);
 const lineH=5;
 const drawRow=(row,bold=false)=>{
   let x=margin;doc.setFontSize(7);doc.setFont(undefined,bold?"bold":"normal");
   row.forEach((cell,i)=>{let txt=String(cell??"");const max=Math.max(8,Math.floor(w[i]/1.75));if(txt.length>max)txt=txt.slice(0,max-1)+"…";doc.text(txt,x+1,y+3.5);doc.rect(x,y,w[i],lineH);x+=w[i]});y+=lineH;
 };
 drawRow(headers,true);
 rows.forEach(r=>{if(y+lineH>pageH-12){doc.addPage();y=12;drawRow(headers,true)}drawRow(r,false)});
 doc.save(name.replace(/[^\wÀ-ÿ]+/g,"_")+".pdf");
}
function downloadCSV(name,rows){const csv=rows.map(r=>r.map(x=>`"${String(x??"").replace(/"/g,'""')}"`).join(";")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));a.download=name.replace(/[^\w]+/g,"_")+".csv";a.click()}
function auditsPage(){
 viewEl.innerHTML=`<div class="card"><div class="title"><h2>Auditoria</h2><span class="muted">Registros somente de inserção</span></div><div class="notice info">Nenhum perfil pode editar ou excluir registros de auditoria nesta homologação.</div>
 <table><tr><th>ID</th><th>Data/hora</th><th>Usuário</th><th>Ação</th><th>Entidade</th><th>Registro</th><th>Detalhes</th></tr>${S.audits.slice().reverse().map(a=>`<tr><td>${a.id}</td><td>${a.at}</td><td>${esc(a.user)}</td><td>${a.action}</td><td>${a.entity}</td><td>${esc(a.record)}</td><td>${esc(a.details)}</td></tr>`).join("")}</table></div>`;
}
function usersPage(){
 viewEl.innerHTML=`<div class="card"><div class="title"><h2>Usuários e Permissões</h2><span class="muted">Admin TI administra</span></div><div class="notice info">Senha provisória e redefinição são administrativas. Conta bloqueia após 5 tentativas inválidas. Não há expiração automática por inatividade.</div>
 ${S.role==="ADMIN"?'<button class="btn primary" onclick="newUser()">Novo usuário</button>':""}
 <table style="margin-top:12px"><tr><th>Usuário</th><th>Perfil</th><th>Status</th><th>Ação</th></tr>${S.users.map((u,i)=>`<tr><td>${esc(u.name)}</td><td>${u.role}</td><td>${u.active?"Ativo":"Inativo"}</td><td>${S.role==="ADMIN"?`<button class="btn secondary" onclick="toggleUser(${i})">${u.active?"Inativar":"Ativar"}</button>`:"—"}</td></tr>`).join("")}</table></div>`;
}
function newUser(){modal("Novo usuário",`<div class="two"><div><label>Nome</label><input id="un"></div><div><label>Perfil</label><select id="ur"><option>DP</option><option>GERENCIA</option><option>FISCAL</option><option>ADMIN</option></select></div></div><div class="right"><button class="btn primary" onclick="saveUser()">Criar</button></div>`)}
function saveUser(){const u={name:un.value.trim(),role:ur.value,active:true};if(!u.name){modal("Obrigatório","Informe o nome.");return}S.users.push(u);save();audit("CRIAR_USUARIO","Usuário",u.name,u.role);closeModal();go("users")}
function toggleUser(i){S.users[i].active=!S.users[i].active;save();audit("ALTERAR_USUARIO","Usuário",S.users[i].name,S.users[i].active?"Ativado":"Inativado");go("users")}
function empName(code){return S.employees.find(e=>e.code===code)?.name||code}
nav();go("dashboard");
</script>
